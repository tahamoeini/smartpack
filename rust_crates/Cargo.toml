[package]
name = "smartpack_rust_crates"
version = "0.3.0-beta.1"
edition = "2021"
rust-version = "1.89"
autobins = false
authors = ["Taha Moeini"]
license = "Apache-2.0"
description = "Cross-platform SmartPack archive engine and CLI"
homepage = "https://taha.one"
repository = "https://github.com/tahamoeini/smartpack"

[lib]
name = "smartpack_engine"
path = "src/lib.rs"

[[bin]]
name = "smartpack"
path = "src/cli.rs"

[dependencies]
argon2 = "0.6"
bzip2 = "0.6"
cap-std = "4.0"
chacha20poly1305 = "0.11"
flate2 = "1.1"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
libarchive_oxide = { version = "0.2", features = ["sevenz", "aes"] }
lzma-rust2 = { version = "0.21", features = ["encoder"] }
parmesan-par2 = "0.5.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
zstd = "0.14"
rpassword = "7.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
unicode-normalization = "0.1"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.20"
